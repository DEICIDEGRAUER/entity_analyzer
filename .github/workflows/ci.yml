name: ci

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        culture: [ ru-RU, en-US, tr-TR ]
    runs-on: ${{ matrix.os }}
    env:
      EA_TEST_CULTURE: ${{ matrix.culture }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # WPF собирается только на Windows; Core/CLI/тесты кроссплатформенные.
      - name: Build solution (Windows, 0 warnings)
        if: runner.os == 'Windows'
        run: dotnet build EntityAnalyzer.slnx -c Release --nologo

      - name: Test Core/CLI
        shell: pwsh
        env:
          ENTITYANALYZER_DATA_DIR: ${{ runner.temp }}/ea-ci-profile
          EA_SEMANTIC_USER_DIR: ${{ runner.temp }}/ea-ci-semantic
        run: |
          dotnet test tests/EntityAnalyzer.Core.Tests/EntityAnalyzer.Core.Tests.csproj -c Release --nologo --blame-crash --logger "console;verbosity=detailed" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ea-test.log"
          $code = $LASTEXITCODE
          Set-Content -Path "$env:RUNNER_TEMP/ea-test-exit.txt" -Value $code
          exit $code

      - name: Test ONNX contract (model-gated tests skip without weights)
        shell: pwsh
        env:
          ENTITYANALYZER_DATA_DIR: ${{ runner.temp }}/ea-ci-profile
          EA_SEMANTIC_USER_DIR: ${{ runner.temp }}/ea-ci-semantic
        run: dotnet test tests/EntityAnalyzer.Embedders.Onnx.Tests/EntityAnalyzer.Embedders.Onnx.Tests.csproj -c Release --nologo --filter "Category!=OnnxGolden" --logger "console;verbosity=normal"

      - name: Test failure details
        if: failure()
        shell: pwsh
        run: |
          function Emit([string]$title, [string]$text) {
            if ([string]::IsNullOrWhiteSpace($text)) { return }
            if ($text.Length -gt 30000) { $text = $text.Substring($text.Length - 30000) }
            $escaped = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=$title::$escaped"
          }

          $log = Join-Path $env:RUNNER_TEMP 'ea-test.log'
          if (Test-Path $log) {
            $exit = if (Test-Path (Join-Path $env:RUNNER_TEMP 'ea-test-exit.txt')) { Get-Content (Join-Path $env:RUNNER_TEMP 'ea-test-exit.txt') } else { '?' }
            $tail = (Get-Content $log | Select-Object -Last 25) -join "`n"
            Emit "Test tail exit=$exit" $tail
            "### Test tail (exit $exit)`n``````text`n$tail`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

            $interesting = (Get-Content $log | Select-String -Pattern 'Failed|Error|Exception|Assert|Stack|Aborted|Segmentation|Unhandled|crash|killed|Starting:' | Select-Object -Last 40 | ForEach-Object { $_.Line }) -join "`n"
            Emit 'Interesting test lines' $interesting
          }

          $trx = Get-ChildItem -Path . -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($trx) {
            $failed = (Select-String -Path $trx.FullName -Pattern 'outcome="Failed"[^>]*testName="([^"]+)"' -AllMatches | ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value }) -join "`n"
            Emit 'Failed tests from TRX' $failed
          }

          $seq = Get-ChildItem -Path . -Recurse -Filter Sequence.xml -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($seq) {
            $raw = Get-Content $seq.FullName -Raw
            $short = if ($raw.Length -gt 12000) { $raw.Substring($raw.Length - 12000) } else { $raw }
            Emit 'Blame sequence tail' $short
          }

      - name: CLI smoke (edge corpus)
        shell: pwsh
        env:
          ENTITYANALYZER_DATA_DIR: ${{ runner.temp }}/ea-ci-profile
          EA_SEMANTIC_USER_DIR: ${{ runner.temp }}/ea-ci-semantic
        run: |
          $corpus = Join-Path $env:RUNNER_TEMP "ea_ci_corpus"
          New-Item -ItemType Directory -Force $corpus | Out-Null
          [System.IO.File]::WriteAllText("$corpus/t.txt", "Nag and Yeb spoke in the dark.", [System.Text.UTF8Encoding]::new($false))
          dotnet publish src/EntityAnalyzer.Cli/EntityAnalyzer.Cli.csproj -c Release -o cli-out --nologo
          & "./cli-out/EntityAnalyzer.Cli" --corpus $corpus --out "$corpus/_out" --preset light --no-incremental
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke-corpus pipeline anchor
        shell: pwsh
        run: |
          $cli = Join-Path $PWD "cli-out/EntityAnalyzer.Cli"
          if (Test-Path "$cli.exe") { $cli = "$cli.exe" }
          & (Join-Path $PWD "scripts/update-smoke-baseline.ps1") -Check -Corpus "test-fixtures/smoke-corpus" -CliPath $cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ONNX is an explicit opt-in layer. This job never downloads a model on a
  # contributor PR: it uses the hash-keyed cache or skips. A push to main may
  # fetch the pinned revision once to seed that cache; the fetch script still
  # verifies every size and SHA-256 before the model becomes available.
  onnx-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EA_ONNX_MODEL_DIR: ${{ github.workspace }}/models/e5-small-int8
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore hash-keyed E5 model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: models/e5-small-int8
          key: e5-small-int8-${{ hashFiles('models/manifest.json') }}

      - name: Ensure E5 model is available
        id: model
        shell: bash
        run: |
          set -euo pipefail
          if [ -f models/e5-small-int8/onnx/model_int8.onnx ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bash scripts/fetch-model.sh -Model e5-small
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ONNX model tests skipped::No hash-keyed model cache is available for this run. Run scripts/fetch-model.sh locally or seed the cache from a main push. Default behavior is a non-blocking skip."
          fi

      - name: Verify cached E5 model hashes
        if: steps.model.outputs.available == 'true'
        shell: bash
        run: bash scripts/fetch-model.sh -Model e5-small -Verify

      - name: Save hash-keyed E5 model cache
        if: steps.model.outputs.available == 'true' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models/e5-small-int8
          key: e5-small-int8-${{ hashFiles('models/manifest.json') }}

      - name: Test ONNX embedder with model
        if: steps.model.outputs.available == 'true'
        env:
          ENTITYANALYZER_DATA_DIR: ${{ runner.temp }}/ea-onnx-profile
          EA_SEMANTIC_USER_DIR: ${{ runner.temp }}/ea-onnx-semantic
        run: dotnet test tests/EntityAnalyzer.Embedders.Onnx.Tests/EntityAnalyzer.Embedders.Onnx.Tests.csproj -c Release --nologo --filter "Category!=OnnxGolden" --logger "console;verbosity=normal"

      - name: Report skipped ONNX job
        if: steps.model.outputs.available != 'true'
        run: |
          echo "ONNX model tests skipped: model weights are absent. This is expected for a contributor PR without the cache." >> "$GITHUB_STEP_SUMMARY"

  # Numerical golden fixtures are intentionally separate from the ordinary
  # ONNX contract job. A mismatch here means the C# pipeline no longer matches
  # the reference implementation of the same int8 profile; it should not be
  # hidden by, or block, the fast contract feedback.
  onnx-golden-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EA_ONNX_MODEL_DIR: ${{ github.workspace }}/models/e5-small-int8
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore hash-keyed E5 model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: models/e5-small-int8
          key: e5-small-int8-${{ hashFiles('models/manifest.json') }}

      - name: Ensure E5 model is available
        id: model
        shell: bash
        run: |
          set -euo pipefail
          if [ -f models/e5-small-int8/onnx/model_int8.onnx ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bash scripts/fetch-model.sh -Model e5-small
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ONNX golden model tests skipped::No hash-keyed model cache is available for this run. The fixture consistency test still runs; model-gated golden tests skip."
          fi

      - name: Verify cached E5 model hashes
        if: steps.model.outputs.available == 'true'
        shell: bash
        run: bash scripts/fetch-model.sh -Model e5-small -Verify

      - name: Test ONNX golden vectors
        env:
          ENTITYANALYZER_DATA_DIR: ${{ runner.temp }}/ea-onnx-golden-profile
          EA_SEMANTIC_USER_DIR: ${{ runner.temp }}/ea-onnx-golden-semantic
        run: dotnet test tests/EntityAnalyzer.Embedders.Onnx.Tests/EntityAnalyzer.Embedders.Onnx.Tests.csproj -c Release --nologo --filter "Category=OnnxGolden" --logger "console;verbosity=normal"

      - name: Report skipped golden model tests
        if: steps.model.outputs.available != 'true'
        run: |
          echo "ONNX golden model tests skipped: model weights are absent. The reference-fixture consistency test ran; this is expected for a contributor PR without the cache." >> "$GITHUB_STEP_SUMMARY"
