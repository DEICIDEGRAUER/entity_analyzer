corpus:
  dir: "ТЕКСТЫ"
  extensions: [".txt"]
  recursive: true
  max_file_size_mb: 100
  skip_duplicates: true  # v18: пропускать файлы с одинаковым содержимым

output:
  dir: "output"
  formats: ["txt", "json"]
  save_quality_report: true
  save_discovered_entities: false
  per_entity_folders: true

cache:
  enabled: true
  dir: "output/.cache"
  max_age_days: 30
  invalidate_on_config_change: true

context:
  max_words: 75
  min_words: 25
  threshold: 50

processing:
  max_workers: 0
  max_mentions_per_file: 12
  sample_size_for_noise_detection: 5
  file_read_timeout: 30
  skip_files_larger_than_mb: 100

quality:
  log_false_positives: false
  log_listing_removals: false

discovery:
  enabled: false
  similarity_threshold: 0.7
  min_entity_length: 3

# v18: Предустановленные режимы поиска
presets:
  minimal:
    description: "Только канонические имена, минимальный контекст"
    iterations: 0
    fuzzy: false
    sbert: false
    max_context_words: 25
    max_mentions_per_file: 3
    deep_corrupt: false
  light:
    description: "Быстрый поиск с базовой генерацией"
    iterations: 1
    fuzzy: false
    sbert: false
    max_context_words: 40
    max_mentions_per_file: 5
    deep_corrupt: false
  medium:
    description: "Стандартный анализ"
    iterations: 1
    fuzzy: true
    sbert: false
    max_context_words: 60
    max_mentions_per_file: 8
    deep_corrupt: true
  extended:
    description: "Расширенный поиск с семантикой"
    iterations: 2
    fuzzy: true
    sbert: true
    max_context_words: 75
    max_mentions_per_file: 12
    deep_corrupt: true
  heavy:
    description: "Глубокий анализ"
    iterations: 2
    fuzzy: true
    sbert: true
    max_context_words: 100
    max_mentions_per_file: 20
    deep_corrupt: true
  maximum:
    description: "Максимальный охват"
    iterations: 3
    fuzzy: true
    sbert: true
    max_context_words: 150
    max_mentions_per_file: 50
    deep_corrupt: true
  titanic:
    description: "Полный анализ без ограничений"
    iterations: 3
    fuzzy: true
    sbert: true
    max_context_words: 200
    max_mentions_per_file: 0
    deep_corrupt: true
  custom1:
    description: "Пользовательский режим 1"
    iterations: 1
    fuzzy: true
    sbert: true
    max_context_words: 100
    max_mentions_per_file: 0
    deep_corrupt: true
  custom2:
    description: "Пользовательский режим 2"
    iterations: 2
    fuzzy: true
    sbert: true
    max_context_words: 50
    max_mentions_per_file: 0
    deep_corrupt: true
  custom3:
    description: "Пользовательский режим 3"
    iterations: 2
    fuzzy: true
    sbert: true
    max_context_words: 120
    max_mentions_per_file: 30
    deep_corrupt: true

