themes:
  "Мифологическое описание":
    description: "Текст рассказывает о происхождении и природе божества, его месте в пантеоне, космологических свойствах, внешнем виде, функциях и атрибутах"
  "Ритуал и призывание":
    description: "Текст описывает проведение обряда, чтение заклинаний, вызов сущности, жертвоприношение, магический круг, алтарь, последовательность ритуальных действий"
  "Художественный сюжет":
    description: "Текст является частью повествования, рассказа или истории с участием персонажей, диалогами, описанием действий и событий"
  "Энциклопедическая статья":
    description: "Текст представляет собой справочную или энциклопедическую статью с перечислением фактов, ссылок на источники, структурированной информацией об объекте"
  "Гримуар":
    description: "Текст написан в стиле магического руководства или колдовской книги, содержит инструкции по проведению ритуалов, рецепты, формулы заклинаний и оккультные символы"
